name: Core OS Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint scripts
        run: shellcheck scripts/*.sh config/includes.chroot/usr/local/bin/core-* || true

  package-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Debian package list
        run: |
          ! grep -E '^(ubuntu-|casper|live-config-upstart|linux-generic)$' config/package-lists/core.list.chroot
          test -f scripts/build-iso.sh
          test -f scripts/preflight.sh
          test -f .github/workflows/build-iso.yml
          test -f .github/workflows/update-bundle.yml
