name: Core OS ISO

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build inside Debian 13 container
        run: |
          docker run --privileged --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:trixie \
            bash -lc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y git live-build debootstrap xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin grub-efi-amd64-signed mtools dosfstools rsync qemu-system-x86 debian-archive-keyring
              chmod +x scripts/*.sh
              ./scripts/build-iso.sh
            '

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-os-1.0-amd64
          path: |
            build/CoreOS-1.0-amd64.iso
            build/CoreOS-1.0-amd64.iso.sha256
          retention-days: 14
